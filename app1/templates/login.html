{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Samanito</title>
    <link rel="icon" type="image/png" href="{% static 'img/Samanito_logo.png' %}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('{% static "img/hero_bg.png" %}');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1;
        }
        .register-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #728156;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.25);
            border-color: #4caf50;
        }
        .btn-register {
            background: #728156;
            border: none;
            color: #E7F5DC;
            padding: 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(114, 129, 86, 0.3);
            background: #52613B;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #728156;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <img src="{% static 'img/Samanito_logo.png' %}" alt="Samanito Logo" class="mb-3" style="max-height: 80px;">
            <h2>Bienvenido</h2>
            <p class="text-muted small">Ingresa a tu cuenta de Samanito</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Nombre de Usuario</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Ej: jperez">
            </div>
            
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Contraseña</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control border-end-0" required placeholder="••••••••">
                    <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword" style="background-color: #f8f9fa; border-color: #dee2e6;">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-register">
                Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>

            <!-- Biometric Fingerprint Button -->
            <div class="mt-3 text-center" id="biometric-login-container" style="display: none;">
                <div class="d-flex align-items-center my-3 text-muted">
                    <hr class="flex-grow-1 my-0">
                    <span class="px-2 small text-uppercase">o accede rápidamente</span>
                    <hr class="flex-grow-1 my-0">
                </div>
                <button type="button" id="btnBiometricLogin" class="btn w-100 py-2.5 fw-semibold shadow-sm border-2" style="border-color: #728156; color: #728156; border-radius: 9999px; background: transparent;" onmouseover="this.style.backgroundColor='#728156'; this.style.color='#E7F5DC';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#728156';">
                    <i class="bi bi-fingerprint fs-4 me-2 align-middle"></i>
                    Entrar con Huella Digital
                </button>
            </div>
        </form>

        <div class="login-link">
            ¿Olvidaste tu contraseña? <a href="{% url 'password_reset' %}">Recupérala aquí</a>
        </div>
        <div class="login-link mt-2">
            ¿No tienes una cuenta? <a href="{% url 'signup' %}">Crea tu finca aquí</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');
    const toggleIcon = document.querySelector('#toggleIcon');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });

    // WebAuthn Fingerprint Login Logic
    if (window.PublicKeyCredential && window.isSecureContext) {
        document.getElementById('biometric-login-container').style.display = 'block';

        function bufferToBase64Url(buffer) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        function base64UrlToBuffer(base64url) {
            const padding = '='.repeat((4 - base64url.length % 4) % 4);
            const base64 = (base64url + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray.buffer;
        }

        document.getElementById('btnBiometricLogin').addEventListener('click', async function() {
            try {
                const optRes = await fetch("{% url 'webauthn_login_options' %}");
                const options = await optRes.json();
                
                const challengeBuffer = base64UrlToBuffer(options.challenge);

                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: challengeBuffer,
                        timeout: options.timeout,
                        userVerification: options.userVerification || 'preferred'
                    }
                });

                const rawId = bufferToBase64Url(credential.rawId);

                const verifyRes = await fetch("{% url 'webauthn_login_verify' %}", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        id: credential.id,
                        rawId: rawId
                    })
                });

                const result = await verifyRes.json();
                if (result.success) {
                    window.location.href = result.redirect;
                } else {
                    alert(result.error || 'Error al autenticar la huella digital');
                }
            } catch (err) {
                console.error(err);
                if (err.name !== 'NotAllowedError') {
                    alert('No se pudo verificar la huella digital: ' + (err.message || 'Operación cancelada'));
                }
            }
        });
    }
</script>
</body>
</html>
