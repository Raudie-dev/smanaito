{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Error del Servidor</title>
    <link rel="icon" type="image/png" href="{% static 'img/Samanito_logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('{% static "img/hero_bg.png" %}');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1;
        }
        .error-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
            padding: 15px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 1s ease-out;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 7rem;
            font-weight: 800;
            color: #d32f2f; /* Un rojo elegante para indicar el fallo */
            margin-bottom: 0;
            line-height: 1;
            text-shadow: 0px 5px 15px rgba(211,47,47,0.2);
        }
        h3 {
            font-family: 'Outfit', sans-serif;
            color: #1e3b20;
            font-weight: 800;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin: 1.5rem 0 2.5rem;
        }
        .btn-custom {
            background: linear-gradient(45deg, #2e7d32, #4caf50);
            border: none;
            border-radius: 50px;
            padding: 12px 35px;
            color: white;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
            text-decoration: none;
            display: inline-block;
            font-size: 1.1rem;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(76, 175, 80, 0.4);
            color: white;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="glass-card">
            <div class="mb-4">
                <img src="{% static 'img/Samanito_logo.png' %}" alt="Samanito" style="max-height: 80px;">
            </div>
            <h1>500</h1>
            <h3 class="mt-3">Error del Servidor</h3>
            <p>Algo salió mal en nuestro lado. Estamos trabajando para solucionarlo lo antes posible. Intenta de nuevo más tarde.</p>
            <a href="/" class="btn-custom">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
