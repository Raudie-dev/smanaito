{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Samanito</title>
    <link rel="icon" type="image/png" href="{% static 'img/Samanito_logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-image: url('{% static "img/hero_bg.png" %}'); background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; position: relative; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1; }
        .register-container { position: relative; z-index: 2; width: 100%; max-width: 450px; padding: 15px; }
        .register-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
        .register-header { text-align: center; margin-bottom: 2rem; }
        .register-header h2 { font-family: 'Outfit', sans-serif; font-weight: 800; color: #728156; }
        .form-control { border-radius: 10px; padding: 0.75rem 1rem; background-color: #f8f9fa; border: 1px solid #dee2e6; }
        .btn-register { background: #728156; border: none; color: #E7F5DC; padding: 0.75rem; border-radius: 9999px; font-weight: 600; width: 100%; font-size: 1.1rem; transition: all 0.3s ease; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(114, 129, 86, 0.3); background: #52613B; }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-link a { color: #728156; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <img src="{% static 'img/Samanito_logo.png' %}" alt="Samanito Logo" class="mb-3" style="max-height: 80px;">
            <h2>Recuperar Contraseña</h2>
            <p class="text-muted small">Ingresa tu correo para recibir las instrucciones.</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                {{ form.email }}
                {% if form.email.errors %}
                <div class="text-danger small mt-1">
                    {{ form.email.errors }}
                </div>
                {% endif %}
            </div>
            <button type="submit" class="btn-register">
                Enviar Correo
            </button>
        </form>
        <div class="login-link">
            <a href="{% url 'login' %}">Volver al Login</a>
        </div>
    </div>
</div>
<script>
    const emailInput = document.querySelector('input[type="email"]');
    if (emailInput) {
        emailInput.classList.add('form-control');
        emailInput.placeholder = 'ejemplo@correo.com';
    }
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function() {
            const btn = form.querySelector('.btn-register');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Enviando...';
            }
        });
    }
</script>
</body>
</html>
