{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Cambiada | Samanito</title>
    <link rel="icon" type="image/png" href="{% static 'img/Samanito_logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-image: url('{% static "img/hero_bg.png" %}'); background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; position: relative; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1; }
        .register-container { position: relative; z-index: 2; width: 100%; max-width: 450px; padding: 15px; }
        .register-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
        .register-header { text-align: center; margin-bottom: 1rem; }
        .register-header h2 { font-family: 'Outfit', sans-serif; font-weight: 800; color: #2e7d32; }
        .btn-register { background: linear-gradient(45deg, #2e7d32, #4caf50); border: none; color: white; padding: 0.75rem; border-radius: 10px; font-weight: 600; width: 100%; font-size: 1.1rem; transition: all 0.3s ease; display: inline-block; text-align: center; text-decoration: none; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3); color: white; }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <img src="{% static 'img/Samanito_logo.png' %}" alt="Samanito Logo" class="mb-3" style="max-height: 80px;">
            <h2>¡Contraseña Actualizada!</h2>
            <p class="text-muted mt-3">Tu contraseña ha sido cambiada exitosamente. Ahora puedes iniciar sesión con tu nueva contraseña.</p>
        </div>
        <a href="{% url 'login' %}" class="btn-register">Iniciar Sesión</a>
    </div>
</div>
</body>
</html>
