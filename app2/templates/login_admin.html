{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Samanito</title>
    <link rel="icon" type="image/png" href="{% static 'img/Samanito_logo.png' %}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('{% static "img/hero_bg.png" %}');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1;
        }
        .register-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }
        .register-card {
            background: rgba(33, 37, 41, 0.95);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h2 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #ffc107;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.25);
            border-color: #ffc107;
            background-color: rgba(255,255,255,0.1);
            color: white;
        }
        .form-control::placeholder {
            color: #6c757d;
        }
        .form-label {
            color: #adb5bd !important;
        }
        .btn-register {
            background: linear-gradient(45deg, #d39e00, #ffc107);
            border: none;
            color: #212529;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 800;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 193, 7, 0.2);
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <img src="{% static 'img/Samanito_logo.png' %}" alt="Samanito Logo" class="mb-3" style="max-height: 80px;">
            <h2>Master Admin</h2>
            <p class="text-secondary small">Samanito SaaS Control</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login_admin' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario Administrador</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Admin ID">
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control border-end-0" required placeholder="••••••••">
                    <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword" style="background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: #adb5bd;">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-register">
                Acceder al Panel <i class="bi bi-shield-check ms-1"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');
    const toggleIcon = document.querySelector('#toggleIcon');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });
</script>
</body>
</html>
